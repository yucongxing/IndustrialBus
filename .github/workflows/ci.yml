name: ci

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install local build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libprotobuf-dev \
            libzmq3-dev \
            protobuf-compiler

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug --parallel 2

      - name: Test
        run: ctest --preset debug
